name: Check DST and Update Schedule

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  check-dst:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Check DST and update workflow
        run: python check_dst.py
      
      - name: Commit changes if any
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update cron schedule for DST"
          git push
